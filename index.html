<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Turismo 360 - Secretaría de Turismo y OCV</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/react@18/umd/react.development.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
</head>
<body class="min-h-screen font-sans transition-colors duration-300">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useRef } = React;

    const APPS_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbwMfm9Fk2v6Q-ysnlB9VLmYukU1F_7sSk1cDL-LsapnhAAK-3WAVKMQoG8u1AmfEZG5eg/exec";
    const REFRESH_MS = 60000;

    const KANBAN_COLUMNS = [
      { key: 'en-tiempo', label: 'En Tiempo', emoji: '🟢' },
      { key: 'demorado', label: 'Demorado', emoji: '🟡' },
      { key: 'detenido', label: 'Detenido', emoji: '🔴' },
      { key: 'completado', label: 'Completado', emoji: '🔵' }
    ];

    async function cloudRequest(payload) {
      const res = await fetch(APPS_SCRIPT_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'text/plain;charset=utf-8' },
        body: JSON.stringify(payload)
      });
      const raw = await res.text();
      let data;
      try {
        data = JSON.parse(raw);
      } catch (e) {
        throw new Error('La respuesta no fue JSON: ' + raw.slice(0, 200));
      }
      if (data.status !== 'success') throw new Error(data.message || 'Error en el servidor');
      return data;
    }

    async function cloudLoad() {
      const res = await fetch(`${APPS_SCRIPT_URL}?t=${Date.now()}`);
      const raw = await res.text();
      let data;
      try {
        data = JSON.parse(raw);
      } catch (e) {
        throw new Error('La respuesta no fue JSON: ' + raw.slice(0, 200));
      }
      if (data.status !== 'success') throw new Error(data.message || 'Error en el servidor');
      return data;
    }

    function App() {
      const [showSplash, setShowSplash] = useState(true);
      const [projects, setProjects] = useState([]);
      const [events, setEvents] = useState([]);
      const [darkMode, setDarkMode] = useState(false);

      const [selectedProject, setSelectedProject] = useState(null);
      const [isAdminOpen, setIsAdminOpen] = useState(false);
      const [viewMode, setViewMode] = useState('linea');
      const [statusFilter, setStatusFilter] = useState('todos');
      const [sortBy, setSortBy] = useState('default');
      const [isLoading, setIsLoading] = useState(false);

      const [syncState, setSyncState] = useState('loading');
      const [lastSync, setLastSync] = useState(null);
      const [cloudEmpty, setCloudEmpty] = useState(false);
      const busyRef = useRef(false);

      const [isAuthenticated, setIsAuthenticated] = useState(false);
      const [loginUser, setLoginUser] = useState('');
      const [loginPass, setLoginPass] = useState('');
      const [authError, setAuthError] = useState('');

      const [editId, setEditId] = useState(null);
      const [title, setTitle] = useState('');
      const [percentage, setPercentage] = useState(0);
      const [color, setColor] = useState('bg-[#FF7A00]');
      const [status, setStatus] = useState('en-tiempo');
      const [notes, setNotes] = useState('');
      const [driveUrl, setDriveUrl] = useState('');
      const [updatesList, setUpdatesList] = useState([]);
      const [newUpdateText, setNewUpdateText] = useState('');

      const [isAddingEvent, setIsAddingEvent] = useState(false);
      const [eventTitle, setEventTitle] = useState('');
      const [eventDate, setEventDate] = useState('');
      const [eventTime, setEventTime] = useState('');

      const [currentDate, setCurrentDate] = useState(new Date(2026, 8, 1));

      useEffect(() => {
        const splashTimer = setTimeout(() => setShowSplash(false), 1600);
        return () => clearTimeout(splashTimer);
      }, []);

      const loadFromCloud = async (silent = false) => {
        if (busyRef.current) return;
        if (!silent) setSyncState('loading');
        try {
          const data = await cloudLoad();
          if (data.projectsSeeded) {
            setProjects(data.projects);
            setSelectedProject(prev => prev ? (data.projects.find(p => p.id === prev.id) || null) : prev);
            setCloudEmpty(false);
          } else {
            setCloudEmpty(true);
            setProjects([]);
          }
          if (data.eventsSeeded) setEvents(data.events);
          else setEvents([]);
          setSyncState('ok');
          setLastSync(new Date());
        } catch (error) {
          console.error("Error al leer de Google Sheets:", error);
          setSyncState('error');
        }
      };

      useEffect(() => {
        loadFromCloud();
        const timer = setInterval(() => {
          if (!document.hidden) loadFromCloud(true);
        }, REFRESH_MS);
        return () => clearInterval(timer);
      }, []);

      const handleLogin = async (e) => {
        e.preventDefault();
        setIsLoading(true);
        try {
          await cloudRequest({ action: 'login', user: loginUser, pass: loginPass });
          setIsAuthenticated(true);
          setAuthError('');
          window._authU = loginUser;
          window._authP = loginPass;
          setLoginUser('');
          setLoginPass('');
        } catch (error) {
          setAuthError('Usuario o contraseña incorrectos.');
        } finally {
          setIsLoading(false);
        }
      };

      const handleLogout = () => {
        setIsAuthenticated(false);
        setIsAdminOpen(false);
        window._authU = '';
        window._authP = '';
        resetForm();
      };

      const handleForcePushToCloud = async () => {
        if (projects.length === 0) {
          alert("No hay proyectos cargados en pantalla para enviar.");
          return;
        }
        if (!window.confirm(`Se reemplazará el contenido de Google Sheets con los ${projects.length} proyectos. ¿Continuar?`)) return;

        busyRef.current = true;
        setIsLoading(true);
        try {
          await cloudRequest({ action: 'syncLocal', user: window._authU, pass: window._authP, projects: projects, events: events });
          setSyncState('ok');
          setLastSync(new Date());
          alert("Sincronización completada correctamente.");
        } catch (error) {
          alert(`No se pudo sincronizar:\n\n${error.message}`);
        } finally {
          busyRef.current = false;
          setIsLoading(false);
        }
      };

      const handleUpdateChange = (index, newText) => {
        const updated = [...updatesList];
        updated[index] = { ...updated[index], text: newText };
        setUpdatesList(updated);
      };

      const handleDeleteUpdate = (index) => {
        setUpdatesList(updatesList.filter((_, i) => i !== index));
      };

      const handleDeleteUpdateFromModal = async (projectId, updateIndex) => {
        const proj = projects.find(p => p.id === projectId);
        if (!proj) return;
        const updatedProj = { ...proj, updates: proj.updates.filter((_, i) => i !== updateIndex) };

        busyRef.current = true;
        try {
          const data = await cloudRequest({ action: 'saveProject', user: window._authU, pass: window._authP, project: updatedProj });
          const saved = data.project || updatedProj;
          setProjects(prev => prev.map(p => p.id === projectId ? saved : p));
          if (selectedProject?.id === projectId) setSelectedProject(saved);
        } catch (error) {
          alert(`No se pudo eliminar la actualización:\n\n${error.message}`);
        } finally {
          busyRef.current = false;
        }
      };

      const handleSaveProject = async (e) => {
        e.preventDefault();
        const cleanTitle = title.trim();
        if (!cleanTitle) return;

        const finalUpdates = [...updatesList];
        if (newUpdateText.trim()) {
          finalUpdates.push({
            date: new Date().toISOString().split('T')[0],
            text: newUpdateText.trim()
          });
        }

        let projId = editId;
        if (!projId) {
          const nums = projects.map(p => parseInt(p.id, 10)).filter(n => !isNaN(n));
          const nextNum = (nums.length ? Math.max(...nums) : 0) + 1;
          projId = nextNum < 10 ? `0${nextNum}` : `${nextNum}`;
        }

        const projectPayload = {
          id: projId,
          title: cleanTitle,
          percentage: Number(percentage),
          status,
          color,
          notes,
          driveUrl: driveUrl.trim(),
          updates: finalUpdates
        };

        busyRef.current = true;
        setIsLoading(true);
        try {
          const data = await cloudRequest({ action: 'saveProject', user: window._authU, pass: window._authP, project: projectPayload });
          const saved = data.project || projectPayload;

          setProjects(prev => editId
            ? prev.map(p => p.id === editId ? saved : p)
            : [...prev, saved]);
          if (selectedProject?.id === saved.id) setSelectedProject(saved);

          setCloudEmpty(false);
          setSyncState('ok');
          setLastSync(new Date());
          resetForm();
        } catch (error) {
          alert(`No se guardó en Google Sheets:\n\n${error.message}`);
        } finally {
          busyRef.current = false;
          setIsLoading(false);
        }
      };

      const handleDeleteProject = async (projectToDelete) => {
        if (!window.confirm(`¿Deseas eliminar "${projectToDelete.title}"?`)) return;

        busyRef.current = true;
        setIsLoading(true);
        try {
          await cloudRequest({
            action: 'deleteProject',
            user: window._authU,
            pass: window._authP,
            id: projectToDelete.id,
            folderUrl: projectToDelete.driveUrl
          });
          setProjects(prev => prev.filter(p => p.id !== projectToDelete.id));
          if (selectedProject?.id === projectToDelete.id) setSelectedProject(null);
          if (editId === projectToDelete.id) resetForm();
        } catch (error) {
          alert(`No se pudo eliminar:\n\n${error.message}`);
        } finally {
          busyRef.current = false;
          setIsLoading(false);
        }
      };

      const handleEditClick = (p) => {
        setEditId(p.id);
        setTitle(p.title);
        setPercentage(p.percentage);
        setColor(p.color);
        setStatus(p.status || 'en-tiempo');
        setNotes(p.notes || '');
        setDriveUrl(p.driveUrl || '');
        setUpdatesList(p.updates || []);
        setNewUpdateText('');
      };

      const resetForm = () => {
        setEditId(null);
        setTitle('');
        setPercentage(0);
        setColor('bg-[#FF7A00]');
        setStatus('en-tiempo');
        setNotes('');
        setDriveUrl('');
        setUpdatesList([]);
        setNewUpdateText('');
      };

      const handleSaveEvent = async (e) => {
        e.preventDefault();
        if (!eventTitle || !eventDate) return;
        const newEv = {
          id: String(Date.now()),
          title: eventTitle,
          date: eventDate,
          time: eventTime || 'Todo el día'
        };

        busyRef.current = true;
        try {
          await cloudRequest({ action: 'saveEvent', user: window._authU, pass: window._authP, event: newEv });
          setEvents(prev => [...prev, newEv]);
          setEventTitle('');
          setEventDate('');
          setEventTime('');
          setIsAddingEvent(false);
        } catch (error) {
          alert(`No se pudo guardar la reunión:\n\n${error.message}`);
        } finally {
          busyRef.current = false;
        }
      };

      const handleDeleteEvent = async (id) => {
        busyRef.current = true;
        try {
          await cloudRequest({ action: 'deleteEvent', user: window._authU, pass: window._authP, id: id });
          setEvents(prev => prev.filter(e => e.id !== id));
        } catch (error) {
          alert(`No se pudo eliminar la reunión:\n\n${error.message}`);
        } finally {
          busyRef.current = false;
        }
      };

      const handleExportPDF = () => {
        const element = document.getElementById('exportable-area');
        html2pdf().set({
          margin: 0.3,
          filename: `Reporte_Ejecutivo_Turismo360_${new Date().toISOString().split('T')[0]}.pdf`,
          image: { type: 'jpeg', quality: 0.98 },
          html2canvas: { scale: 2 },
          jsPDF: { unit: 'in', format: 'letter', orientation: 'landscape' }
        }).from(element).save();
      };

      const getDaysInMonth = (y, m) => new Date(y, m + 1, 0).getDate();
      const getFirstDayOfMonth = (y, m) => new Date(y, m, 1).getDay();

      const year = currentDate.getFullYear();
      const month = currentDate.getMonth();
      const monthNames = ["Enero", "Febrero", "Marzo", "Abril", "Mayo", "Junio", "Julio", "Agosto", "Septiembre", "Octubre", "Noviembre", "Diciembre"];

      const daysInMonth = getDaysInMonth(year, month);
      const firstDay = getFirstDayOfMonth(year, month);

      const calendarDays = [];
      for (let i = 0; i < firstDay; i++) calendarDays.push(null);
      for (let d = 1; d <= daysInMonth; d++) calendarDays.push(d);

      const prevMonth = () => setCurrentDate(new Date(year, month - 1, 1));
      const nextMonth = () => setCurrentDate(new Date(year, month + 1, 1));

      const totalProjectsCount = projects.length;
      const completedCount = projects.filter(p => p.status === 'completado' || Number(p.percentage) === 100).length;
      const onTimeCount = projects.filter(p => p.status === 'en-tiempo').length;
      const delayedCount = projects.filter(p => p.status === 'demorado').length;
      const stoppedCount = projects.filter(p => p.status === 'detenido').length;
      const healthScore = totalProjectsCount > 0 ? Math.round(((onTimeCount + completedCount) / totalProjectsCount) * 100) : 100;

      const filteredProjects = projects.filter(p => statusFilter === 'todos' || p.status === statusFilter);
      const sortedAndFilteredProjects = [...filteredProjects].sort((a, b) => {
        if (sortBy === 'asc') return Number(a.percentage) - Number(b.percentage);
        if (sortBy === 'desc') return Number(b.percentage) - Number(a.percentage);
        return 0;
      });

      const sortedEvents = [...events].sort((a, b) => String(a.date).localeCompare(String(b.date)));

      const getStatusBadge = (st) => {
        switch(st) {
          case 'en-tiempo': return <span className="px-2.5 py-0.5 rounded text-[10px] font-bold bg-emerald-100 text-emerald-800 border border-emerald-300">🟢 En Tiempo</span>;
          case 'demorado':  return <span className="px-2.5 py-0.5 rounded text-[10px] font-bold bg-amber-100 text-amber-800 border border-amber-300">🟡 Demorado</span>;
          case 'detenido':  return <span className="px-2.5 py-0.5 rounded text-[10px] font-bold bg-rose-100 text-rose-800 border border-rose-300">🔴 Detenido</span>;
          case 'completado':return <span className="px-2.5 py-0.5 rounded text-[10px] font-bold bg-blue-100 text-blue-800 border border-blue-300">🔵 Completado</span>;
          default: return null;
        }
      };

      const lastSyncText = lastSync ? lastSync.toLocaleTimeString('es-MX', { hour: '2-digit', minute: '2-digit' }) : '';

      return (
        <div className={`min-h-screen transition-colors duration-300 ${darkMode ? 'bg-[#0B0F19] text-slate-100' : 'bg-[#F8FAFC] text-[#1E293B]'}`}>
          {/* SPLASH SCREEN */}
          <div className={`fixed inset-0 z-50 flex flex-col items-center justify-center bg-[#1E293B] text-white transition-opacity duration-700 ${showSplash ? 'opacity-100 pointer-events-auto' : 'opacity-0 pointer-events-none'}`}>
            <div className="flex items-center gap-4 mb-4">
              <img src="logotipo-ocv-monterrey.svg" alt="OCV Monterrey" className="h-12 object-contain" />
              <div className="w-[1px] h-10 bg-white/20"></div>
              <img src="Logo_de_la_Secretaría_de_Trabajo_de_Nuevo_León_(2021).svg" alt="Secretaría de Trabajo" className="h-12 object-contain" />
            </div>
            <h1 className="text-3xl md:text-4xl font-black tracking-widest uppercase text-center px-4 bg-gradient-to-r from-white via-slate-200 to-[#FF7A00] bg-clip-text text-transparent">
              TURISMO 360
            </h1>
            <p className="text-[#8B5CF6] tracking-wider text-xs font-bold mt-2 uppercase text-center">
              Project Management &amp; Monitoring Platform
            </p>
            <p className="text-slate-400 text-[11px] font-medium tracking-wide uppercase mt-1">
              Secretaría de Turismo y OCV
            </p>
            <div className="mt-8 flex items-center gap-2 text-xs text-slate-400">
              <span className="inline-block w-4 h-4 border-2 border-[#FF7A00] border-t-transparent rounded-full animate-spin"></span>
              Cargando plataforma ejecutiva...
            </div>
          </div>

          <div className="p-4 md:p-8 font-sans max-w-[1400px] mx-auto">
            <header className={`text-center mb-6 relative backdrop-blur-md p-6 rounded-2xl shadow-sm border flex flex-col md:flex-row items-center justify-between gap-4 transition-colors duration-300 ${darkMode ? 'bg-slate-900/90 border-slate-800 text-white' : 'bg-white/90 border-slate-200 text-[#1E293B]'}`}>
              <div className="flex items-center gap-3">
                <img src="logotipo-ocv-monterrey.svg" alt="OCV Monterrey" className="h-9 object-contain" />
              </div>

              <div className="text-center">
                <h1 className={`text-2xl md:text-3xl font-black tracking-wider uppercase ${darkMode ? 'text-white' : 'text-[#1E293B]'}`}>
                  TURISMO 360
                </h1>
                <p className="text-[#8B5CF6] tracking-widest text-[11px] font-extrabold mt-0.5 uppercase">
                  Project Management &amp; Monitoring Platform
                </p>
                <p className={`tracking-wide text-xs font-bold uppercase mt-0.5 ${darkMode ? 'text-slate-400' : 'text-slate-600'}`}>
                  Secretaría de Turismo y OCV
                </p>
                <p className="text-[11px] font-semibold mt-1">
                  {syncState === 'loading' && <span className="text-slate-400">⏳ Conectando con Google Drive...</span>}
                  {syncState === 'ok' && <span className="text-emerald-500">☁️ Sincronizado en tiempo real · {lastSyncText}</span>}
                  {syncState === 'error' && <span className="text-rose-500">⚠️ Sin conexión con Google Sheets.</span>}
                </p>
              </div>

              <div className="flex items-center gap-3">
                <img src="Logo_de_la_Secretaría_de_Trabajo_de_Nuevo_León_(2021).svg" alt="Secretaría de Trabajo" className="h-10 object-contain" />
                
                <button 
                  onClick={() => setDarkMode(!darkMode)} 
                  className={`p-2.5 rounded-xl border text-base transition shadow-sm ${darkMode ? 'bg-slate-800 border-slate-700 text-amber-400 hover:bg-slate-700' : 'bg-slate-100 border-slate-200 text-slate-700 hover:bg-slate-200'}`}
                  title={darkMode ? 'Modo Día' : 'Modo Noche'}
                >
                  {darkMode ? '☀️' : '🌙'}
                </button>

                {isAuthenticated ? (
                  <>
                    <button onClick={() => setIsAdminOpen(!isAdminOpen)} className="bg-[#8B5CF6] hover:bg-[#7c3aed] text-white font-medium text-xs px-3 py-2 rounded-lg shadow-sm transition">
                      {isAdminOpen ? 'Ocultar Admin' : '⚙️ Panel Admin'}
                    </button>
                    <button onClick={handleLogout} className="bg-rose-600 hover:bg-rose-700 text-white font-medium text-xs px-3 py-2 rounded-lg shadow-sm transition">
                      🔒 Salir
                    </button>
                  </>
                ) : (
                  <button onClick={() => setIsAdminOpen(!isAdminOpen)} className={`font-medium text-xs px-4 py-2 rounded-lg shadow-sm transition ${darkMode ? 'bg-slate-800 text-white hover:bg-slate-700 border border-slate-700' : 'bg-[#1E293B] hover:bg-slate-900 text-white'}`}>
                    🔐 Acceso Admin
                  </button>
                )}
              </div>
            </header>

            {/* KPI CARDS */}
            <div className="grid grid-cols-2 md:grid-cols-4 gap-4 mb-6">
              <div className={`backdrop-blur-md p-4 rounded-2xl shadow-sm border flex items-center justify-between ${darkMode ? 'bg-slate-900/90 border-slate-800' : 'bg-white/90 border-slate-200'}`}>
                <div>
                  <p className="text-[11px] font-bold text-slate-400 uppercase tracking-wider">Total Pendientes</p>
                  <h3 className="text-2xl font-black mt-1">{totalProjectsCount}</h3>
                </div>
                <div className={`w-10 h-10 rounded-xl flex items-center justify-center text-lg ${darkMode ? 'bg-slate-800' : 'bg-slate-100'}`}>📊</div>
              </div>

              <div className={`backdrop-blur-md p-4 rounded-2xl shadow-sm border flex items-center justify-between ${darkMode ? 'bg-slate-900/90 border-slate-800' : 'bg-white/90 border-slate-200'}`}>
                <div>
                  <p className="text-[11px] font-bold text-emerald-500 uppercase tracking-wider">Índice de Salud</p>
                  <h3 className="text-2xl font-black text-emerald-400 mt-1">{healthScore}%</h3>
                </div>
                <div className={`w-10 h-10 rounded-xl flex items-center justify-center text-lg ${darkMode ? 'bg-emerald-950/50' : 'bg-emerald-50'}`}>🟢</div>
              </div>

              <div className={`backdrop-blur-md p-4 rounded-2xl shadow-sm border flex items-center justify-between ${darkMode ? 'bg-slate-900/90 border-slate-800' : 'bg-white/90 border-slate-200'}`}>
                <div>
                  <p className="text-[11px] font-bold text-amber-500 uppercase tracking-wider">Demorados</p>
                  <h3 className="text-2xl font-black text-amber-400 mt-1">{delayedCount}</h3>
                </div>
                <div className={`w-10 h-10 rounded-xl flex items-center justify-center text-lg ${darkMode ? 'bg-amber-950/50' : 'bg-amber-50'}`}>🟡</div>
              </div>

              <div className={`backdrop-blur-md p-4 rounded-2xl shadow-sm border flex items-center justify-between ${darkMode ? 'bg-slate-900/90 border-slate-800' : 'bg-white/90 border-slate-200'}`}>
                <div>
                  <p className="text-[11px] font-bold text-rose-500 uppercase tracking-wider">Detenidos</p>
                  <h3 className="text-2xl font-black text-rose-400 mt-1">{stoppedCount}</h3>
                </div>
                <div className={`w-10 h-10 rounded-xl flex items-center justify-center text-lg ${darkMode ? 'bg-rose-950/50' : 'bg-rose-50'}`}>🔴</div>
              </div>
            </div>

            {/* BARRA DE HERRAMIENTAS */}
            <div className={`backdrop-blur-md p-3 rounded-xl shadow-sm border mb-6 flex flex-wrap items-center justify-between gap-3 ${darkMode ? 'bg-slate-900/90 border-slate-800' : 'bg-white/90 border-slate-200'}`}>
              <div className="flex items-center gap-2 flex-wrap">
                <span className="text-xs font-bold text-slate-400 uppercase">Filtro Estado:</span>
                <button onClick={() => setStatusFilter('todos')} className={`text-xs px-3 py-1.5 rounded-lg border font-semibold transition ${statusFilter === 'todos' ? 'bg-[#1E293B] text-white border-transparent' : 'bg-slate-50 text-slate-700'}`}>Todos</button>
                <button onClick={() => setStatusFilter('en-tiempo')} className={`text-xs px-3 py-1.5 rounded-lg border font-semibold ${statusFilter === 'en-tiempo' ? 'bg-emerald-600 text-white border-transparent' : 'bg-emerald-50 text-emerald-700'}`}>🟢 En Tiempo</button>
                <button onClick={() => setStatusFilter('demorado')} className={`text-xs px-3 py-1.5 rounded-lg border font-semibold ${statusFilter === 'demorado' ? 'bg-amber-500 text-white border-transparent' : 'bg-amber-50 text-amber-700'}`}>🟡 Demorado</button>
                <button onClick={() => setStatusFilter('detenido')} className={`text-xs px-3 py-1.5 rounded-lg border font-semibold ${statusFilter === 'detenido' ? 'bg-rose-600 text-white border-transparent' : 'bg-rose-50 text-rose-700'}`}>🔴 Detenido</button>
              </div>

              <div className="flex items-center gap-3 flex-wrap">
                <div className="flex items-center gap-1.5">
                  <span className="text-xs font-bold text-slate-400 uppercase">Ordenar:</span>
                  <select value={sortBy} onChange={e => setSortBy(e.target.value)} className={`text-xs border rounded-lg p-1.5 font-semibold ${darkMode ? 'bg-slate-800 border-slate-700 text-white' : 'bg-slate-50 border-slate-200 text-slate-700'}`}>
                    <option value="default">Por defecto (ID)</option>
                    <option value="asc">📈 % Menor a Mayor</option>
                    <option value="desc">📉 % Mayor a Menor</option>
                  </select>
                </div>

                <button onClick={() => loadFromCloud()} className={`font-bold text-xs px-3 py-2 rounded-lg border ${darkMode ? 'bg-slate-800 border-slate-700 text-slate-300' : 'bg-slate-100 border-slate-200 text-slate-700'}`}>🔄 Actualizar</button>

                <div className={`p-1 rounded-lg border flex text-xs font-semibold ${darkMode ? 'bg-slate-800 border-slate-700' : 'bg-slate-100 border-slate-200'}`}>
                  <button onClick={() => setViewMode('linea')} className={`px-3 py-1.5 rounded-md ${viewMode === 'linea' ? 'bg-white shadow-sm text-[#1E293B] font-bold' : 'text-slate-400'}`}>📊 Línea</button>
                  <button onClick={() => setViewMode('kanban')} className={`px-3 py-1.5 rounded-md ${viewMode === 'kanban' ? 'bg-white shadow-sm text-[#1E293B] font-bold' : 'text-slate-400'}`}>📋 Kanban</button>
                </div>

                <button onClick={handleExportPDF} className="bg-[#FF7A00] hover:bg-[#e06c00] text-white font-bold text-xs px-3 py-2 rounded-lg shadow-sm">📄 PDF</button>
              </div>
            </div>

            {/* PANEL ADMIN */}
            {isAdminOpen && (
              <div className={`max-w-5xl mx-auto p-6 rounded-2xl shadow-md border mb-8 ${darkMode ? 'bg-slate-900 border-slate-800 text-white' : 'bg-white border-[#8B5CF6]/30 text-[#1E293B]'}`}>
                {!isAuthenticated ? (
                  <div className="max-w-sm mx-auto p-4">
                    <h2 className="text-center font-bold mb-4 text-lg">🔒 Verificación de Administrador</h2>
                    {authError && <p className="text-rose-500 text-xs mb-3 text-center font-semibold">{authError}</p>}
                    <form onSubmit={handleLogin} className="space-y-4">
                      <div>
                        <label className="block text-xs font-bold text-slate-400 uppercase mb-1">Usuario</label>
                        <input type="text" required value={loginUser} onChange={e => setLoginUser(e.target.value)} className={`w-full border rounded p-2 text-sm ${darkMode ? 'bg-slate-850 border-slate-700 text-white' : 'border-slate-300'}`} placeholder="Usuario" />
                      </div>
                      <div>
                        <label className="block text-xs font-bold text-slate-400 uppercase mb-1">Contraseña</label>
                        <input type="password" required value={loginPass} onChange={e => setLoginPass(e.target.value)} className={`w-full border rounded p-2 text-sm ${darkMode ? 'bg-slate-850 border-slate-700 text-white' : 'border-slate-300'}`} placeholder="Contraseña" />
                      </div>
                      <button type="submit" disabled={isLoading} className="w-full bg-[#8B5CF6] hover:bg-[#7c3aed] text-white font-bold py-2 rounded text-sm transition">
                        {isLoading ? 'Verificando...' : 'Ingresar de forma segura'}
                      </button>
                    </form>
                  </div>
                ) : (
                  <div>
                    <div className={`mb-6 p-4 border rounded-xl flex items-center justify-between gap-3 ${darkMode ? 'bg-purple-950/40 border-purple-900 text-purple-200' : 'bg-purple-50 border-purple-200 text-purple-900'}`}>
                      <div>
                        <h3 className="font-bold text-xs uppercase">Sincronización Segura con Google Sheets</h3>
                        <p className="text-xs opacity-80">Volcado validado en el servidor.</p>
                      </div>
                      <button onClick={handleForcePushToCloud} disabled={isLoading} className="bg-[#8B5CF6] text-white font-bold text-xs px-4 py-2 rounded-lg shadow">
                        ☁️ Enviar Datos
                      </button>
                    </div>

                    <h2 className="text-lg font-bold mb-4 border-b pb-2 flex items-center justify-between">
                      <span>{editId ? `Editar Proyecto ${editId}` : '➕ Anexar Nuevo Pendiente'}</span>
                    </h2>

                    <form onSubmit={handleSaveProject} className="grid grid-cols-1 md:grid-cols-2 gap-4">
                      <div>
                        <label className="block text-xs font-bold text-slate-400 uppercase mb-1">Título</label>
                        <input type="text" required value={title} onChange={e => setTitle(e.target.value)} placeholder="Ej. Campaña" className={`w-full border rounded p-2 text-sm ${darkMode ? 'bg-slate-8' : 'border-slate-300'}`} />
                      </div>
                      <div>
                        <label className="block text-xs font-bold text-slate-400 uppercase mb-1">Porcentaje (0-100)</label>
                        <input type="number" min="0" max="100" value={percentage} onChange={e => setPercentage(e.target.value)} className={`w-full border rounded p-2 text-sm ${darkMode ? 'bg-slate-8' : 'border-slate-300'}`} />
                      </div>
                      <div>
                        <label className="block text-xs font-bold text-slate-400 uppercase mb-1">Estado</label>
                        <select value={status} onChange={e => setStatus(e.target.value)} className={`w-full border rounded p-2 text-sm ${darkMode ? 'bg-slate-8' : 'border-slate-300'}`}>
                          <option value="en-tiempo">🟢 En Tiempo</option>
                          <option value="demorado">🟡 Demorado</option>
                          <option value="detenido">🔴 Detenido</option>
                          <option value="completado">🔵 Completado</option>
                        </select>
                      </div>
                      <div>
                        <label className="block text-xs font-bold text-slate-400 uppercase mb-1">Color de Barra</label>
                        <select value={color} onChange={e => setColor(e.target.value)} className={`w-full border rounded p-2 text-sm ${darkMode ? 'bg-slate-8' : 'border-slate-300'}`}>
                          <option value="bg-[#FF7A00]">🟠 Naranja</option>
                          <option value="bg-[#8B5CF6]">🟣 Lila</option>
                          <option value="bg-teal-600">🟢 Turquesa</option>
                          <option value="bg-blue-600">🔵 Azul</option>
                          <option value="bg-rose-600">🔴 Coral</option>
                        </select>
                      </div>
                      <div className="md:col-span-2">
                        <label className="block text-xs font-bold text-slate-400 uppercase mb-1">Notas Importantes</label>
                        <textarea value={notes} onChange={e => setNotes(e.target.value)} rows="2" className={`w-full border rounded p-2 text-sm ${darkMode ? 'bg-slate-8' : 'border-slate-300'}`}></textarea>
                      </div>
                      <div className="md:col-span-2 flex justify-end gap-2">
                        {editId && <button type="button" onClick={resetForm} className="bg-slate-400 text-white text-xs px-4 py-2 rounded">Cancelar</button>}
                        <button type="submit" disabled={isLoading} className="bg-[#FF7A00] text-white text-xs px-6 py-2 rounded font-bold">
                          {editId ? 'Guardar Cambios' : 'Anexar Pendiente'}
                        </button>
                      </div>
                    </form>
                  </div>
                )}
              </div>
            )}

            {/* VISTA PRINCIPAL */}
            <div id="exportable-area">
              <div className="grid grid-cols-1 lg:grid-cols-12 gap-6">
                <div className="lg:col-span-4 space-y-6">
                  <div className={`backdrop-blur-md p-5 rounded-2xl shadow-sm border ${darkMode ? 'bg-slate-950/40 border-slate-800' : 'bg-white border-slate-200'}`}>
                    <div className="flex items-center justify-between mb-4">
                      <h3 className="font-extrabold text-sm uppercase">📅 {monthNames[month]} {year}</h3>
                      <div className="flex gap-1">
                        <button onClick={prevMonth} className="px-2.5 py-1 text-xs rounded font-bold bg-slate-100 text-slate-700">◄</button>
                        <button onClick={nextMonth} className="px-2.5 py-1 text-xs rounded font-bold bg-slate-100 text-slate-700">►</button>
                      </div>
                    </div>
                    <div className="grid grid-cols-7 text-center text-[10px] font-bold text-slate-400 mb-2">
                      <div>DOM</div><div>LUN</div><div>MAR</div><div>MIÉ</div><div>JUE</div><div>VIE</div><div>SÁB</div>
                    </div>
                    <div className="grid grid-cols-7 gap-1 text-center text-xs">
                      {calendarDays.map((d, i) => {
                        if (!d) return <div key={i} className="h-8"></div>;
                        const dateStr = `${year}-${String(month + 1).padStart(2, '0')}-${String(d).padStart(2, '0')}`;
                        const hasEv = events.some(ev => ev.date === dateStr);
                        return <div key={i} className={`h-8 flex items-center justify-center rounded-xl font-semibold ${hasEv ? 'bg-[#8B5CF6]/20 text-[#8B5CF6] border border-[#8B5CF6]/40 font-bold' : ''}`}>{d}</div>;
                      })}
                    </div>
                  </div>

                  <div className={`backdrop-blur-md p-5 rounded-2xl shadow-sm border ${darkMode ? 'bg-slate-950/40 border-slate-800' : 'bg-white border-slate-200'}`}>
                    <h3 className="font-extrabold text-sm uppercase mb-3">🔔 Reuniones</h3>
                    <div className="space-y-2 max-h-[250px] overflow-y-auto">
                      {events.length === 0 ? <p className="text-xs text-slate-400">Sin eventos.</p> : events.map(ev => (
                        <div key={ev.id} className="p-2.5 rounded-lg border text-xs bg-slate-50 text-slate-800 flex justify-between">
                          <div><b>{ev.title}</b><br/>{ev.date}</div>
                          {isAuthenticated && <button onClick={() => handleDeleteEvent(ev.id)} className="text-rose-500 font-bold">✕</button>}
                        </div>
                      ))}
                    </div>
                  </div>
                </div>

                <div className={`lg:col-span-8 backdrop-blur-md p-6 rounded-2xl shadow-sm border ${darkMode ? 'bg-slate-950/40 border-slate-800' : 'bg-white border-slate-200'}`}>
                  {viewMode === 'linea' ? (
                    <div className="space-y-6">
                      {sortedAndFilteredProjects.map(p => (
                        <div key={p.id} className="flex items-start">
                          <div className={`w-10 h-10 border-2 rounded-full flex items-center justify-center font-bold text-xs mr-3 ${darkMode ? 'bg-slate-800 border-slate-700 text-white' : 'bg-white border-slate-300'}`}>{p.id}</div>
                          <div className="flex-grow cursor-pointer" onClick={() => setSelectedProject(p)}>
                            <div className="flex justify-between items-center mb-1">
                              <span className="font-bold text-xs">{p.title}</span>
                              <span className="font-bold text-xs text-[#8B5CF6]">{p.percentage}%</span>
                            </div>
                            <div className="bg-slate-100 h-6 rounded-full overflow-hidden border">
                              <div className={`h-full ${p.color}`} style={{ width: `${p.percentage}%` }}></div>
                            </div>
                          </div>
                          <div className="ml-3 mt-4">{getStatusBadge(p.status)}</div>
                        </div>
                      ))}
                    </div>
                  ) : (
                    <div className="grid grid-cols-1 sm:grid-cols-2 xl:grid-cols-4 gap-4">
                      {KANBAN_COLUMNS.map(col => {
                        const colP = sortedAndFilteredProjects.filter(p => p.status === col.key);
                        return (
                          <div key={col.key} className="rounded-xl border p-3 bg-slate-50/50 flex flex-col min-h-[200px]">
                            <h4 className="text-xs font-bold uppercase mb-2 text-slate-700">{col.emoji} {col.label} ({colP.length})</h4>
                            <div className="space-y-2 flex-grow">
                              {colP.map(p => (
                                <div key={p.id} onClick={() => setSelectedProject(p)} className="bg-white p-2.5 rounded-lg border shadow-sm cursor-pointer">
                                  <div className="text-xs font-bold text-slate-800 mb-1">{p.title}</div>
                                  <div className="bg-slate-100 h-1.5 rounded-full overflow-hidden">
                                    <div className={`h-full ${p.color}`} style={{ width: `${p.percentage}%` }}></div>
                                  </div>
                                </div>
                              ))}
                            </div>
                          </div>
                        );
                      })}
                    </div>
                  )}
                </div>
              </div>
            </div>

            {/* MODAL */}
            {selectedProject && (
              <div className="fixed inset-0 bg-slate-950/70 backdrop-blur-sm flex items-center justify-center z-50 p-4">
                <div className={`rounded-2xl p-6 max-w-lg w-full shadow-2xl relative ${darkMode ? 'bg-slate-900 text-white' : 'bg-white text-slate-900'}`}>
                  <button onClick={() => setSelectedProject(null)} className="absolute top-4 right-4 text-slate-400 font-bold text-xl">✕</button>
                  <h2 className="text-xl font-bold mb-2">{selectedProject.title}</h2>
                  <p className="text-sm text-[#8B5CF6] font-bold mb-4">Progreso: {selectedProject.percentage}%</p>
                  {selectedProject.notes && <p className="text-xs bg-amber-50 text-amber-900 p-3 rounded mb-4"><b>Notas:</b> {selectedProject.notes}</p>}
                  <button onClick={() => setSelectedProject(null)} className="w-full bg-[#1E293B] text-white py-2 rounded-xl text-sm">Cerrar</button>
                </div>
              </div>
            )}
          </div>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
