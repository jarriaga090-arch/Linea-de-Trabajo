<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#1E293B" />
  <title>Turismo 360 · Secretaría de Turismo y OCV</title>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet" />

  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: { sans: ['Inter', 'ui-sans-serif', 'system-ui', 'sans-serif'] }
        }
      }
    };
  </script>

  <script src="https://unpkg.com/react@18/umd/react.development.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>

  <style>
    html { -webkit-text-size-adjust: 100%; scroll-behavior: smooth; }
    body { font-family: 'Inter', ui-sans-serif, system-ui, sans-serif; -webkit-font-smoothing: antialiased; -moz-osx-font-smoothing: grayscale; }
    ::selection { background: #8B5CF6; color: #fff; }

    * { scrollbar-width: thin; scrollbar-color: #cbd5e1 transparent; }
    *::-webkit-scrollbar { width: 8px; height: 8px; }
    *::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 999px; }
    *::-webkit-scrollbar-thumb:hover { background: #94a3b8; }
    *::-webkit-scrollbar-track { background: transparent; }

    @keyframes fadeUp { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
    .anim-fade-up { animation: fadeUp .5s cubic-bezier(.22,1,.36,1) both; }

    @keyframes splashBar { from { width: 0%; } to { width: 100%; } }
    .splash-bar { animation: splashBar 1.5s cubic-bezier(.4,0,.2,1) forwards; }

    @keyframes toastIn { from { opacity: 0; transform: translate(-50%, 14px); } to { opacity: 1; transform: translate(-50%, 0); } }
    .toast-in { animation: toastIn .28s cubic-bezier(.22,1,.36,1) both; }

    @keyframes pulseDot { 0%,100% { opacity: 1; } 50% { opacity: .35; } }
    .pulse-dot { animation: pulseDot 1.8s ease-in-out infinite; }

    input[type="date"]::-webkit-calendar-picker-indicator { opacity: .55; cursor: pointer; }
    select option { color: #0f172a; }

    @media print {
      header, .no-print { display: none !important; }
      body { background: #fff !important; }
    }
  </style>
</head>
<body class="min-h-screen transition-colors duration-300">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useRef } = React;

    const APPS_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbwMfm9Fk2v6Q-ysnlB9VLmYukU1F_7sSk1cDL-LsapnhAAK-3WAVKMQoG8u1AmfEZG5eg/exec";
    const REFRESH_MS = 60000;

    async function cloudRequest(payload) {
      const res = await fetch(APPS_SCRIPT_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'text/plain;charset=utf-8' },
        body: JSON.stringify(payload)
      });
      const raw = await res.text();
      let data;
      try {
        data = JSON.parse(raw);
      } catch (e) {
        throw new Error("La respuesta no fue JSON: " + raw.slice(0, 200));
      }
      if (data.status !== 'success') throw new Error(data.message || 'Error en el servidor');
      return data;
    }

    async function cloudLoad() {
      const res = await fetch(APPS_SCRIPT_URL + "?t=" + Date.now());
      const raw = await res.text();
      let data;
      try {
        data = JSON.parse(raw);
      } catch (e) {
        throw new Error("La respuesta no fue JSON: " + raw.slice(0, 200));
      }
      if (data.status !== 'success') throw new Error(data.message || 'Error en el servidor');
      return data;
    }

    function App() {
      const [showSplash, setShowSplash] = useState(true);
      const [projects, setProjects] = useState([]);
      const [events, setEvents] = useState([]);
      const [infrastructure, setInfrastructure] = useState([]);
      const [darkMode, setDarkMode] = useState(false);

      const [selectedProject, setSelectedProject] = useState(null);
      const [isAdminOpen, setIsAdminOpen] = useState(false);
      const [statusFilter, setStatusFilter] = useState('todos');
      const [sortBy, setSortBy] = useState('default');
      const [searchTerm, setSearchTerm] = useState('');
      const [isLoading, setIsLoading] = useState(false);

      const [syncState, setSyncState] = useState('loading');
      const [lastSync, setLastSync] = useState(null);
      const busyRef = useRef(false);

      const [toast, setToast] = useState(null);
      const toastTimer = useRef(null);

      const [isAuthenticated, setIsAuthenticated] = useState(false);
      const [loginUser, setLoginUser] = useState('');
      const [loginPass, setLoginPass] = useState('');
      const [authError, setAuthError] = useState('');

      const [editId, setEditId] = useState(null);
      const [title, setTitle] = useState('');
      const [percentage, setPercentage] = useState(0);
      const [color, setColor] = useState('bg-[#FF7A00]');
      const [status, setStatus] = useState('en-tiempo');
      const [notes, setNotes] = useState('');
      const [driveUrl, setDriveUrl] = useState('');
      const [updatesList, setUpdatesList] = useState([]);
      const [newUpdateText, setNewUpdateText] = useState('');

      const [eventTitle, setEventTitle] = useState('');
      const [eventDate, setEventDate] = useState('');
      const [eventTime, setEventTime] = useState('');

      const [currentDate, setCurrentDate] = useState(new Date());

      const showToast = (message, type = 'error') => {
        setToast({ message, type });
        clearTimeout(toastTimer.current);
        toastTimer.current = setTimeout(() => setToast(null), 4200);
      };

      useEffect(() => {
        const splashTimer = setTimeout(() => setShowSplash(false), 1600);
        return () => clearTimeout(splashTimer);
      }, []);

      useEffect(() => {
        const onKey = (e) => { if (e.key === 'Escape') setSelectedProject(null); };
        window.addEventListener('keydown', onKey);
        return () => window.removeEventListener('keydown', onKey);
      }, []);

      const loadFromCloud = async (silent = false) => {
        if (busyRef.current) return;
        if (!silent) setSyncState('loading');
        try {
          const data = await cloudLoad();
          if (data.projects) setProjects(data.projects);
          else setProjects([]);
          if (data.events) setEvents(data.events);
          else setEvents([]);
          if (data.infrastructure) setInfrastructure(data.infrastructure);
          else setInfrastructure([]);
          setSyncState('ok');
          setLastSync(new Date());
        } catch (error) {
          console.error("Error al leer:", error);
          setSyncState('error');
        }
      };

      useEffect(() => {
        loadFromCloud();
        const timer = setInterval(() => { if (!document.hidden) loadFromCloud(true); }, REFRESH_MS);
        return () => clearInterval(timer);
      }, []);

      const handleLogin = async (e) => {
        e.preventDefault();
        setIsLoading(true);
        try {
          await cloudRequest({ action: 'login', user: loginUser, pass: loginPass });
          setIsAuthenticated(true);
          setAuthError('');
          window._authU = loginUser;
          window._authP = loginPass;
          setLoginUser('');
          setLoginPass('');
          showToast('Sesión iniciada correctamente.', 'success');
        } catch (error) {
          setAuthError('Usuario o contraseña incorrectos.');
        } finally {
          setIsLoading(false);
        }
      };

      const handleLogout = () => {
        setIsAuthenticated(false);
        setIsAdminOpen(false);
        window._authU = '';
        window._authP = '';
        resetForm();
      };

      const handleUpdateChange = (index, newText) => {
        const updated = [...updatesList];
        updated[index] = { ...updated[index], text: newText };
        setUpdatesList(updated);
      };

      const handleDeleteUpdate = (index) => {
        setUpdatesList(updatesList.filter((_, i) => i !== index));
      };

      const handleSaveProject = async (e) => {
        e.preventDefault();
        if (!title.trim()) return;

        const finalUpdates = [...updatesList];
        if (newUpdateText.trim()) {
          finalUpdates.push({ date: new Date().toISOString().split('T')[0], text: newUpdateText.trim() });
        }

        let projId = editId;
        if (!projId) {
          const nums = projects.map(p => parseInt(p.id, 10)).filter(n => !isNaN(n));
          const nextNum = (nums.length ? Math.max(...nums) : 0) + 1;
          projId = nextNum < 10 ? "0" + nextNum : String(nextNum);
        }

        const payload = {
          id: projId,
          title: title.trim(),
          percentage: Number(percentage),
          status,
          color,
          notes,
          driveUrl: driveUrl.trim(),
          updates: finalUpdates
        };

        busyRef.current = true;
        setIsLoading(true);
        try {
          const data = await cloudRequest({ action: 'saveProject', user: window._authU, pass: window._authP, project: payload });
          const saved = data.project || payload;
          setProjects(prev => editId ? prev.map(p => p.id === editId ? saved : p) : [...prev, saved]);
          if (selectedProject?.id === saved.id) setSelectedProject(saved);
          resetForm();
          showToast(editId ? 'Pendiente actualizado.' : 'Pendiente anexado.', 'success');
        } catch (error) {
          showToast("Error al guardar: " + error.message, 'error');
        } finally {
          busyRef.current = false;
          setIsLoading(false);
        }
      };

      const handleDeleteProject = async (proj) => {
        if (!proj) return;
        if (!window.confirm('¿Deseas eliminar "' + proj.title + '"?')) return;
        busyRef.current = true;
        setIsLoading(true);
        try {
          await cloudRequest({ action: 'deleteProject', user: window._authU, pass: window._authP, id: proj.id, folderUrl: proj.driveUrl });
          setProjects(prev => prev.filter(p => p.id !== proj.id));
          if (selectedProject?.id === proj.id) setSelectedProject(null);
          if (editId === proj.id) resetForm();
          showToast('Pendiente eliminado.', 'success');
        } catch (error) {
          showToast("Error: " + error.message, 'error');
        } finally {
          busyRef.current = false;
          setIsLoading(false);
        }
      };

      const handleEditClick = (p) => {
        setEditId(p.id);
        setTitle(p.title);
        setPercentage(p.percentage);
        setColor(p.color || 'bg-[#FF7A00]');
        setStatus(p.status || 'en-tiempo');
        setNotes(p.notes || '');
        setDriveUrl(p.driveUrl || '');
        setUpdatesList(p.updates || []);
        setNewUpdateText('');
      };

      const resetForm = () => {
        setEditId(null);
        setTitle('');
        setPercentage(0);
        setColor('bg-[#FF7A00]');
        setStatus('en-tiempo');
        setNotes('');
        setDriveUrl('');
        setUpdatesList([]);
        setNewUpdateText('');
      };

      const handleSaveEvent = async (e) => {
        e.preventDefault();
        if (!eventTitle || !eventDate) return;
        const newEv = { id: String(Date.now()), title: eventTitle, date: eventDate, time: eventTime || 'Todo el día' };

        busyRef.current = true;
        setIsLoading(true);
        try {
          await cloudRequest({ action: 'saveEvent', user: window._authU, pass: window._authP, event: newEv });
          setEvents(prev => [...prev, newEv]);
          setEventTitle('');
          setEventDate('');
          setEventTime('');
          showToast('Reunión programada.', 'success');
        } catch (error) {
          showToast("Error al guardar reunión: " + error.message, 'error');
        } finally {
          busyRef.current = false;
          setIsLoading(false);
        }
      };

      const handleDeleteEvent = async (id) => {
        busyRef.current = true;
        setIsLoading(true);
        try {
          await cloudRequest({ action: 'deleteEvent', user: window._authU, pass: window._authP, id });
          setEvents(prev => prev.filter(ev => ev.id !== id));
        } catch (error) {
          showToast("Error al eliminar reunión: " + error.message, 'error');
        } finally {
          busyRef.current = false;
          setIsLoading(false);
        }
      };

      const handleExportPDF = () => {
        const element = document.getElementById('exportable-area');
        html2pdf().set({
          margin: 0.3,
          filename: "Reporte_Turismo360_" + new Date().toISOString().split('T')[0] + ".pdf",
          image: { type: 'jpeg', quality: 0.98 },
          html2canvas: { scale: 2, useCORS: true, backgroundColor: darkMode ? '#0B0F19' : '#ffffff' },
          jsPDF: { unit: 'in', format: 'letter', orientation: 'landscape' }
        }).from(element).save();
      };

      const getDaysInMonth = (y, m) => new Date(y, m + 1, 0).getDate();
      const getFirstDayOfMonth = (y, m) => new Date(y, m, 1).getDay();

      const year = currentDate.getFullYear();
      const month = currentDate.getMonth();
      const monthNames = ["Enero", "Febrero", "Marzo", "Abril", "Mayo", "Junio", "Julio", "Agosto", "Septiembre", "Octubre", "Noviembre", "Diciembre"];

      const daysInMonth = getDaysInMonth(year, month);
      const firstDay = getFirstDayOfMonth(year, month);
      const calendarDays = [];
      for (let i = 0; i < firstDay; i++) calendarDays.push(null);
      for (let d = 1; d <= daysInMonth; d++) calendarDays.push(d);

      const prevMonth = () => setCurrentDate(new Date(year, month - 1, 1));
      const nextMonth = () => setCurrentDate(new Date(year, month + 1, 1));

      const totalProjectsCount = projects.length;
      const onTimeCount = projects.filter(p => p.status === 'en-tiempo').length;
      const completedCount = projects.filter(p => p.status === 'completado' || Number(p.percentage) === 100).length;
      const delayedCount = projects.filter(p => p.status === 'demorado').length;
      const stoppedCount = projects.filter(p => p.status === 'detenido').length;
      const healthScore = totalProjectsCount > 0 ? Math.round(((onTimeCount + completedCount) / totalProjectsCount) * 100) : 100;

      const searchedProjects = projects.filter(p =>
        !searchTerm.trim() || String(p.title || '').toLowerCase().includes(searchTerm.trim().toLowerCase())
      );
      const filteredProjects = searchedProjects.filter(p => statusFilter === 'todos' || p.status === statusFilter);
      const sortedAndFilteredProjects = [...filteredProjects].sort((a, b) => {
        if (sortBy === 'asc') return Number(a.percentage) - Number(b.percentage);
        if (sortBy === 'desc') return Number(b.percentage) - Number(a.percentage);
        return 0;
      });

      const sortedEvents = [...events].sort((a, b) => String(a.date).localeCompare(String(b.date)));

      const lastSyncText = lastSync ? lastSync.toLocaleTimeString('es-MX', { hour: '2-digit', minute: '2-digit' }) : '';

      const todayReal = new Date();
      const todayYear = todayReal.getFullYear();
      const todayMonth = todayReal.getMonth();
      const todayDate = todayReal.getDate();

      /* ---------- Design tokens ---------- */
      const surface = darkMode ? "bg-slate-900 border-slate-800" : "bg-white border-slate-200";
      const card = "rounded-2xl border shadow-sm transition-colors duration-300 " + surface;
      const subtle = darkMode ? "bg-slate-800/60 border-slate-700" : "bg-slate-50 border-slate-200";
      const muted = darkMode ? "text-slate-400" : "text-slate-500";
      const heading = darkMode ? "text-white" : "text-slate-900";

      const inputCls = "w-full rounded-xl border px-3 py-2.5 text-sm font-medium outline-none transition focus:ring-4 " + (
        darkMode
          ? "bg-slate-800/70 border-slate-700 text-slate-100 placeholder-slate-500 focus:border-[#8B5CF6] focus:ring-[#8B5CF6]/20"
          : "bg-white border-slate-300 text-slate-800 placeholder-slate-400 focus:border-[#8B5CF6] focus:ring-[#8B5CF6]/15"
      );
      const labelCls = "block text-[10px] font-bold uppercase tracking-wider mb-1.5 " + muted;

      const getStatusBadge = (st) => {
        const map = {
          'en-tiempo': {
            label: 'En Tiempo', dot: 'bg-emerald-500',
            cls: darkMode ? 'bg-emerald-500/10 text-emerald-300 border-emerald-500/30' : 'bg-emerald-50 text-emerald-700 border-emerald-200'
          },
          'demorado': {
            label: 'Demorado', dot: 'bg-amber-500',
            cls: darkMode ? 'bg-amber-500/10 text-amber-300 border-amber-500/30' : 'bg-amber-50 text-amber-700 border-amber-200'
          },
          'detenido': {
            label: 'Detenido', dot: 'bg-rose-500',
            cls: darkMode ? 'bg-rose-500/10 text-rose-300 border-rose-500/30' : 'bg-rose-50 text-rose-700 border-rose-200'
          },
          'completado': {
            label: 'Completado', dot: 'bg-blue-500',
            cls: darkMode ? 'bg-blue-500/10 text-blue-300 border-blue-500/30' : 'bg-blue-50 text-blue-700 border-blue-200'
          }
        };
        const m = map[st] || {
          label: 'Sin estado', dot: 'bg-slate-400',
          cls: darkMode ? 'bg-slate-700/40 text-slate-300 border-slate-600' : 'bg-slate-100 text-slate-600 border-slate-200'
        };
        return (
          <span className={"inline-flex items-center gap-1.5 px-2.5 py-1 rounded-full text-[10px] font-bold uppercase tracking-wide border whitespace-nowrap " + m.cls}>
            <span className={"w-1.5 h-1.5 rounded-full " + m.dot}></span>
            {m.label}
          </span>
        );
      };

      const filterPills = [
        { key: 'todos', label: 'Todos', count: totalProjectsCount },
        { key: 'en-tiempo', label: 'En Tiempo', count: onTimeCount },
        { key: 'demorado', label: 'Demorado', count: delayedCount },
        { key: 'detenido', label: 'Detenido', count: stoppedCount },
        { key: 'completado', label: 'Completado', count: completedCount }
      ];

      const distribution = [
        { label: 'En Tiempo', count: onTimeCount, bar: 'bg-emerald-500' },
        { label: 'Completado', count: completedCount, bar: 'bg-blue-500' },
        { label: 'Demorado', count: delayedCount, bar: 'bg-amber-500' },
        { label: 'Detenido', count: stoppedCount, bar: 'bg-rose-500' }
      ];

      const kpis = [
        { label: 'Total Pendientes', value: totalProjectsCount, icon: '📋', tone: darkMode ? 'text-slate-100' : 'text-slate-900', ring: darkMode ? 'bg-slate-800 text-slate-200' : 'bg-slate-100 text-slate-600' },
        { label: 'Índice de Salud', value: healthScore + '%', icon: '💚', tone: 'text-emerald-500', ring: darkMode ? 'bg-emerald-500/10 text-emerald-400' : 'bg-emerald-50 text-emerald-600' },
        { label: 'Demorados', value: delayedCount, icon: '⚠️', tone: 'text-amber-500', ring: darkMode ? 'bg-amber-500/10 text-amber-400' : 'bg-amber-50 text-amber-600' },
        { label: 'Detenidos', value: stoppedCount, icon: '⛔', tone: 'text-rose-500', ring: darkMode ? 'bg-rose-500/10 text-rose-400' : 'bg-rose-50 text-rose-600' }
      ];

      return (
        <div className={"min-h-screen transition-colors duration-300 " + (darkMode ? "bg-[#0B0F19] text-slate-100" : "bg-[#F6F8FB] text-[#1E293B]")}>

          {/* ============ SPLASH ============ */}
          <div className={"fixed inset-0 z-[70] flex flex-col items-center justify-center bg-[#1E293B] text-white transition-opacity duration-700 " + (showSplash ? "opacity-100 pointer-events-auto" : "opacity-0 pointer-events-none")}>
            <div className="absolute inset-0 opacity-[0.07] pointer-events-none"
                 style={{ backgroundImage: 'radial-gradient(circle at 20% 20%, #FF7A00 0, transparent 45%), radial-gradient(circle at 80% 70%, #8B5CF6 0, transparent 45%)' }}></div>

            <div className="relative flex flex-col items-center px-6">
              <div className="flex items-center gap-4 mb-6">
                <img src="logotipo-ocv-monterrey.svg" alt="OCV Monterrey" className="h-12 object-contain" onError={(e) => { e.currentTarget.style.display = 'none'; }} />
                <div className="w-px h-10 bg-white/20"></div>
                <img src="Logo_de_la_Secretaría_de_Trabajo_de_Nuevo_León_(2021).svg" alt="Secretaría de Trabajo" className="h-12 object-contain" onError={(e) => { e.currentTarget.style.display = 'none'; }} />
              </div>

              <h1 className="text-3xl md:text-4xl font-black tracking-[0.18em] uppercase text-center bg-gradient-to-r from-white via-slate-200 to-[#FF7A00] bg-clip-text text-transparent">
                TURISMO 360
              </h1>
              <p className="text-[#A78BFA] tracking-[0.22em] text-[10px] font-bold mt-3 uppercase text-center">
                Project Management &amp; Monitoring Platform
              </p>
              <p className="text-slate-400 text-[10px] font-semibold tracking-[0.18em] uppercase mt-1.5">
                Secretaría de Turismo y OCV
              </p>

              <div className="mt-10 w-56 h-[3px] rounded-full bg-white/10 overflow-hidden">
                <div className="splash-bar h-full rounded-full bg-gradient-to-r from-[#FF7A00] to-[#8B5CF6]"></div>
              </div>
              <p className="mt-4 text-[11px] text-slate-400 font-medium tracking-wide">Cargando plataforma ejecutiva…</p>
            </div>
          </div>

          {/* ============ TOP LOADING BAR ============ */}
          <div className={"fixed top-0 left-0 right-0 z-[65] h-[3px] transition-opacity duration-300 " + (isLoading ? "opacity-100" : "opacity-0")}>
            <div className="h-full w-full bg-gradient-to-r from-[#FF7A00] via-[#8B5CF6] to-[#FF7A00] animate-pulse"></div>
          </div>

          {/* ============ TOAST ============ */}
          {toast && (
            <div className="fixed bottom-6 left-1/2 -translate-x-1/2 z-[80] toast-in w-[calc(100%-2rem)] max-w-md">
              <div className={"flex items-start gap-3 rounded-xl border px-4 py-3 shadow-xl backdrop-blur-md " + (
                toast.type === 'success'
                  ? (darkMode ? "bg-emerald-950/90 border-emerald-800 text-emerald-100" : "bg-white border-emerald-200 text-emerald-900")
                  : (darkMode ? "bg-rose-950/90 border-rose-800 text-rose-100" : "bg-white border-rose-200 text-rose-900")
              )}>
                <span className="text-base leading-none mt-0.5">{toast.type === 'success' ? '✅' : '⚠️'}</span>
                <p className="text-xs font-semibold leading-relaxed flex-1">{toast.message}</p>
                <button onClick={() => setToast(null)} className="text-xs font-bold opacity-50 hover:opacity-100 transition">✕</button>
              </div>
            </div>
          )}

          {/* ============ HEADER ============ */}
          <header className={"sticky top-0 z-40 border-b backdrop-blur-xl transition-colors duration-300 " + (
            darkMode ? "bg-[#0B0F19]/85 border-slate-800" : "bg-white/85 border-slate-200"
          )}>
            <div className="max-w-[1400px] mx-auto px-4 md:px-8 py-3 flex items-center justify-between gap-4">

              <div className="flex items-center gap-3 shrink-0">
                <img src="logotipo-ocv-monterrey.svg" alt="OCV Monterrey" className="h-9 md:h-10 object-contain" onError={(e) => { e.currentTarget.style.display = 'none'; }} />
              </div>

              <div className="text-center flex-1 min-w-0">
                <h1 className={"text-lg md:text-2xl font-black tracking-[0.12em] uppercase leading-tight " + heading}>
                  TURISMO 360
                </h1>

                      const mStr = (month + 1) < 10 ? '0' + (month + 1) : (month + 1);
                      const dateStr = year + "-" + mStr + "-" + dStr;
                      const hasEv = events.some(ev => ev.date === dateStr);
                      const isToday = (year === todayYear && month === todayMonth && d === todayDate);

                      let dayClasses = "relative h-8 flex items-center justify-center rounded-lg font-semibold transition ";
                      if (isToday) {
                        dayClasses += "bg-[#FF7A00] text-white font-black shadow-sm ring-2 ring-[#FF7A00]/30 ";
                      } else if (hasEv) {
                        dayClasses += darkMode ? "bg-[#8B5CF6]/20 text-[#A78BFA] border border-[#8B5CF6]/40 font-bold " : "bg-[#8B5CF6]/10 text-[#7c3aed] border border-[#8B5CF6]/30 font-bold ";
                      } else {
                        dayClasses += darkMode ? "text-slate-300 hover:bg-slate-800" : "text-slate-600 hover:bg-slate-100";
                      }

                      return (
                        <div key={i} className={dayClasses} title={hasEv ? 'Reunión programada' : ''}>
                          {d}
                          {hasEv && !isToday && (
                            <span className="absolute bottom-1 w-1 h-1 rounded-full bg-[#8B5CF6]"></span>

                              Visitar ↗
                            </a>
                          </div>

              </div>

              {/* Columna derecha: proyectos */}
              <div className={card + " lg:col-span-8 p-5 md:p-6"}>
                <div className="flex items-center justify-between mb-4">
                  <h3 className={"font-extrabold text-xs uppercase tracking-wider " + heading}>Pendientes en seguimiento</h3>
                  <span className={"text-[10px] font-bold " + muted}>{sortedAndFilteredProjects.length} de {totalProjectsCount}</span>
                </div>

                <div className="space-y-3">
                  {sortedAndFilteredProjects.length === 0 ? (
                    <div className={"text-center py-14 rounded-xl border border-dashed " + (darkMode ? "border-slate-700" : "border-slate-300")}>
                      <p className="text-2xl mb-2 opacity-40">📭</p>
                      <p className={"text-xs font-semibold " + muted}>No hay pendientes que coincidan con los filtros.</p>
                    </div>
                  ) : sortedAndFilteredProjects.map(p => {
                    const pct = Math.max(0, Math.min(100, Number(p.percentage) || 0));
                    return (
                      <div
                        key={p.id}
                        onClick={() => setSelectedProject(p)}
                        className={"group rounded-xl border p-4 cursor-pointer transition hover:shadow-md " + (
                          darkMode ? "bg-slate-800/40 border-slate-700/70 hover:border-slate-600" : "bg-slate-50/60 border-slate-200 hover:border-slate-300"
                        )}
                      >
                        <div className="flex items-start gap-3">
                          <div className={"w-9 h-9 rounded-lg flex items-center justify-center font-extrabold text-[10px] shrink-0 border " + (
                            darkMode ? "bg-slate-800 border-slate-700 text-slate-200" : "bg-white border-slate-200 text-slate-600"
                          )}>
                            {p.id}
                          </div>

                          <div className="flex-1 min-w-0">
                            <div className="flex items-start justify-between gap-3">
                              <h4 className={"font-bold text-xs md:text-sm leading-snug truncate " + (darkMode ? "text-slate-100" : "text-slate-800")}>{p.title}</h4>
                              <span className={"text-xs md:text-sm font-extrabold tabular-nums shrink-0 " + (darkMode ? "text-[#A78BFA]" : "text-[#7c3aed]")}>{pct}%</span>
                            </div>

                            <div className={"mt-2 h-2 w-full rounded-full overflow-hidden " + (darkMode ? "bg-slate-700/60" : "bg-slate-200/80")}>
                              <div
                                className={"h-full rounded-full transition-all duration-700 ease-out " + (p.color || 'bg-[#FF7A00]')}
                                style={{ width: pct + "%" }}
                              ></div>
                            </div>

                            <div className="mt-2.5 flex items-center justify-between gap-2">
                              {getStatusBadge(p.status)}
                              <span className={"text-[10px] font-bold opacity-0 group-hover:opacity-100 transition " + (darkMode ? "text-slate-400" : "text-slate-500")}>
                                Ver detalle →
                              </span>
                            </div>
                          </div>
                        </div>
                      </div>
                    );
                  })}
                </div>
              </div>
            </div>
          </main>

          {/* ============ MODAL DETALLES ============ */}
          {selectedProject && (
            <div
              className="fixed inset-0 bg-slate-950/60 backdrop-blur-sm flex items-center justify-center z-50 p-4"
              onClick={(e) => { if (e.target === e.currentTarget) setSelectedProject(null); }}
            >
              <div className={"rounded-2xl max-w-lg w-full shadow-2xl relative max-h-[90vh] overflow-y-auto anim-fade-up border " + (
                darkMode ? "bg-slate-900 text-slate-100 border-slate-800" : "bg-white text-slate-900 border-slate-200"
              )}>

                <div className={"sticky top-0 px-6 pt-5 pb-4 border-b backdrop-blur " + (darkMode ? "bg-slate-900/95 border-slate-800" : "bg-white/95 border-slate-200")}>
                  <div className="flex items-start justify-between gap-4">
                    <div className="min-w-0">
                      <span className={"text-[10px] font-bold uppercase tracking-wider " + muted}>Pendiente #{selectedProject.id}</span>
                      <h2 className="text-lg font-bold leading-snug mt-0.5">{selectedProject.title}</h2>
                    </div>
                    <button
                      onClick={() => setSelectedProject(null)}
                      aria-label="Cerrar"
                      className={"w-8 h-8 flex items-center justify-center rounded-lg font-bold text-sm shrink-0 transition " + (darkMode ? "text-slate-400 hover:bg-slate-800" : "text-slate-500 hover:bg-slate-100")}
                    >
                      ✕
                    </button>
                  </div>

                  <div className="mt-3 flex items-center gap-3">
                    <div className={"flex-1 h-2 rounded-full overflow-hidden " + (darkMode ? "bg-slate-800" : "bg-slate-100")}>
                      <div
                        className={"h-full rounded-full " + (selectedProject.color || 'bg-[#FF7A00]')}
                        style={{ width: Math.max(0, Math.min(100, Number(selectedProject.percentage) || 0)) + "%" }}
                      ></div>
                    </div>
                    <span className={"text-xs font-extrabold tabular-nums " + (darkMode ? "text-[#A78BFA]" : "text-[#7c3aed]")}>
                      {Number(selectedProject.percentage) || 0}%
                    </span>
                  </div>

                  <div className="mt-3">{getStatusBadge(selectedProject.status)}</div>
                </div>

                <div className="px-6 py-5">
                  {selectedProject.notes && (
                    <div className={"mb-5 p-3.5 rounded-xl border text-xs leading-relaxed " + (
                      darkMode ? "bg-amber-500/10 border-amber-500/25 text-amber-200" : "bg-amber-50 border-amber-200 text-amber-900"
                    )}>
                      <b className="block mb-1 text-[10px] uppercase tracking-wider opacity-80">Notas importantes</b>
                      {selectedProject.notes}
                    </div>
                  )}

                  <div className="mb-5">
                    <h4 className={"text-[10px] font-bold uppercase tracking-wider mb-2.5 " + muted}>Historial de actualizaciones</h4>
                    {selectedProject.updates && selectedProject.updates.length > 0 ? (
                      <ul className="space-y-2">
                        {selectedProject.updates.map((up, idx) => (
                          <li key={idx} className={"text-xs p-3 rounded-xl border flex gap-2 " + (darkMode ? "bg-slate-800/60 border-slate-700" : "bg-slate-50 border-slate-200")}>
                            <span className={"font-bold tabular-nums shrink-0 " + muted}>{up.date}</span>
                            <span className="leading-relaxed">{up.text}</span>
                          </li>
                        ))}
                      </ul>
                    ) : (
                      <p className={"text-[11px] italic " + muted}>No hay actualizaciones registradas.</p>
                    )}
                  </div>

                  {selectedProject.driveUrl && (
                    <div className="mb-5">
                      <a
                        href={selectedProject.driveUrl}
                        target="_blank"
                        rel="noopener noreferrer"
                        className="inline-flex items-center gap-2 bg-[#FF7A00] hover:bg-[#e06c00] text-white font-bold text-[11px] px-4 py-2.5 rounded-xl transition shadow-sm"
                      >
                        📁 Abrir carpeta en Google Drive →
                      </a>
                    </div>
                  )}

                  <button
                    onClick={() => setSelectedProject(null)}
                    className={"w-full py-2.5 rounded-xl text-sm font-bold transition " + (darkMode ? "bg-slate-800 hover:bg-slate-700 text-white" : "bg-[#1E293B] hover:bg-slate-900 text-white")}
                  >
                    Cerrar
                  </button>
                </div>
              </div>
            </div>
          )}
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
